<!doctype html>
<html lang="{{code}}" dir="{{dir}}"><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Body'ye verilen overflow viewport'a sizar, yani kendini kirpmaz. RTL
     sayfada kosedeki parilti sola tasip butun duzeni saga kaydiriyordu.
     html'e olcu vermek kirpmayi body'de tutuyor. */
  html { width: 1200px; height: 630px; overflow: hidden; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #131110; color: #f4f1ec;
    font-family: {{og_font}};
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 66px 72px;
    position: relative;
  }
  /* A dim green glow in the corner. */
  body::before {
    content: ""; position: absolute; inset-inline-end: -180px; top: -180px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(61,220,132,0.16), transparent 68%);
  }
  .top { display: flex; align-items: center; gap: 14px; position: relative; }
  .mark { width: 34px; height: 25px; border: 2.4px solid #3ddc84; border-radius: 6px; position: relative; }
  .mark::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 16px; height: 2.4px; background: #3ddc84; transform: translateX(-50%); }
  .top span { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; color: #a29b91; }
  h1 { font-size: {{og_h1_size}}; line-height: 1.08; letter-spacing: {{og_h1_tracking}}; font-weight: 600; max-width: {{og_h1_width}}; position: relative; }
  /* "Android TV" her dilde vurgunun icinde. Bolunmesine izin vermek
     ikinci satirda yalniz bir "TV" birakiyordu. */
  h1 em { font-style: normal; color: #3ddc84; white-space: nowrap; }
  p { margin-top: 26px; font-size: 30px; line-height: 1.4; color: #a29b91; max-width: 30ch; position: relative; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; position: relative; }
  .url { font-size: 28px; font-weight: 600; color: #131110; background: #3ddc84; padding: 12px 26px; border-radius: 999px; }
</style></head><body>
  <div class="top"><span class="mark"></span><span>cobanov</span></div>
  <div>
    <h1>{{og_h1}}</h1>
    <p>{{og_sub}}</p>
  </div>
  <div class="bottom">
    <div></div>
    <div class="url" dir="ltr">tv.cobanov.dev</div>
  </div>
</body></html>
